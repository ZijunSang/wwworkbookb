<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Press Start 2P", monospace;
            color: #95bcf6;
            text-align: center;
            padding: 20px;
            gap: 40px;
        }

        header {
            font-size: clamp(20px, 6vw, 60px);
            line-height: 1.4;
            text-shadow: 0 0 12px #ff22f0, 0 0 24px #8e31ff;
            max-width: 900px;
        }

        button {
            background: #b650b0;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-family: "Press Start 2P", monospace;
            font-size: clamp(12px, 2vw, 18px);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            box-shadow: 0 0 12px #c476ff;
        }

        button:hover {
            transform: scale(1.08);
            background: #6666ff;
        }

        a {
            text-decoration: none;
            color: #000;
        }
    </style>
</head>
<body>
    <header>
        HOPE TO SEE YOU SOON
    </header>

    <button id="homeBtn">
        <a href="index.html">GO HOME</a>  
    </button>

    <audio id="warnSound" loop>
        <source src="outrosound.mp3" type="audio/mpeg">
    </audio>

<script>
  const audio = document.getElementById('warnSound');
  const homeBtn = document.getElementById('homeBtn');
  audio.volume = 0.5;

  document.addEventListener('click', () => {
    audio.play();
  }, { once: true });

  homeBtn.addEventListener('click', () => {
    audio.pause();
    audio.currentTime = 0;
  });

  window.addEventListener('beforeunload', () => {
    audio.pause();
    audio.currentTime = 0;
  });
</script>
</body>
</html>
