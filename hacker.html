<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Press Start 2P", monospace;
      color: #95bcf6;
      text-align: center;
      padding: 20px;
      gap: 24px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.03),
        rgba(255, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0%   { opacity: 0.2; }
      50%  { opacity: 0.08; }
      100% { opacity: 0.2; }
    }

    /* error code — small label at top */
    .error-code {
      font-size: clamp(9px, 1.2vw, 12px);
      color: #ff4df0;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff00ff;
      animation: textGlitch 0.3s infinite alternate;
    }

    /* main heading */
    header {
      font-size: clamp(13px, 2.2vw, 26px);
      line-height: 1.9;
      max-width: 820px;
      animation:
        shake 3s infinite,
        glow 1s infinite alternate;
    }

    @keyframes shake {
      0%,  90% { transform: translateX(0); }
      91%      { transform: translateX(-3px); }
      92%      { transform: translateX( 3px); }
      93%      { transform: translateX(-3px); }
      94%      { transform: translateX( 3px); }
      95%, 100%{ transform: translateX(0); }
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px #ff00ff,
          0 0 20px #7b00ff;
      }
      to {
        text-shadow:
          0 0 20px #ff66ff,
          0 0 40px #ae00ff;
      }
    }

    @keyframes textGlitch {
      from { transform: translateX(-1px); }
      to   { transform: translateX( 1px); }
    }

    img {
      width: min(220px, 40vw);
      border-radius: 12px;
      box-shadow:
        0 0 20px #ff00ff,
        0 0 40px #7b00ff;
      animation: pulse 2s infinite;
      cursor: zoom-in;
    }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }

    #lightbox.open {
      display: flex;
    }

    #lightbox img {
      width: auto;
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow:
        0 0 40px #ff00ff,
        0 0 80px #7b00ff;
      animation: none;
      cursor: zoom-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #b650b0;
      color: #000;
      border: none;
      padding: 14px 28px;
      font-family: "Press Start 2P", monospace;
      font-size: clamp(9px, 1.4vw, 13px);
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.2s;
      animation: buttonFlash 1s infinite alternate;
    }

    @keyframes buttonFlash {
      from { box-shadow: 0 0 12px #ff00ff; }
      to   { box-shadow: 0 0 30px #6f00ff; }
    }

    button:hover {
      transform: scale(1.08);
      background: #6666ff;
    }
  </style>
</head>

<body>

  <div class="error-code">ERR0R_#991 // SYSTEM BREACH DETECTED</div>

  <header>
    WE HAVE SHUT DOWN CANVAS SYSTEMS<br>
    ACROSS ALL UNIVERSITIES ON EARTH.<br>
    YOU THOUGHT YOU COULD ESCAPE<br>
    BECAUSE YOU ARE NOT ON EARTH?<br>
    NO ONE CAN ESCAPE OUR CONTROL.
  </header>

  <img src="hacking.png" alt="hacking" onclick="document.getElementById('lightbox').classList.add('open')">

  <!-- fullscreen lightbox -->
  <div id="lightbox" onclick="this.classList.remove('open')">
    <img src="hacking.png" alt="hacking fullscreen">
  </div>

  <div class="btn-group">
    <button onclick="location.href='week9.html'">PAY THE MONEY NOW</button>
    <button onclick="location.href='hacker2.html'">FK U</button>
  </div>

  <audio id="warnSound" autoplay loop>
    <source src="alert.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('warnSound');
    audio.volume = 0.5;

    audio.play().catch(() => {
      document.addEventListener('click', () => audio.play(), { once: true });
    });
  </script>

</body>
</html>
